# Este flujo de trabajo etiqueta automáticamente las Pull Requests
# basándose en los directorios o archivos que han sido modificados.

name: PR Labeler

on:
  pull_request_target:
    branches: [ main ]

jobs:
  label:
    name: Auto-label PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Apply Labels
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true
